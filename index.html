<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#020305">
<title>AFTERHOURS — Issue 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/afterhours.css?v=2">
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div><div id="grain"></div><div id="flash"></div>

<section id="boot" class="screen on">
  <div class="mast">AFTER<br>HOURS</div>
  <div class="sub">Issue 01. The night edition.</div>
  <div class="bar"><i id="bootbar"></i></div>
  <button class="tap" id="tap">Open the issue</button>
</section>

<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div class="shead"><div><span class="k" id="shKick"></span><b id="shName"></b></div><button id="shClose">Close</button></div>
  <div class="sbody" id="shBody"></div>
  <div class="snav"><button id="shPrev" aria-label="Previous car">←</button><span id="shPg"></span><button id="shNext" aria-label="Next car">→</button></div>
</aside>

<section id="loading" class="screen">
  <div class="mast">AFTERHOURS</div>
  <div class="where"><b id="ldwhere">Harbor Line</b><span id="ldsub">Tunnel 7. Two laps, four cars.</span></div>
  <div class="bar"><i id="ldbar"></i></div>
</section>

<section id="select" class="screen">
  <div class="top"><span class="m">AFTERHOURS</span><span class="r"><span id="issue">Issue 01</span><button id="glow">Glow on</button><button id="snd">Sound on</button></span></div>
  <h1 class="hl" id="sHead"></h1>
  <div class="stamp" id="sStamp"></div>
  <div class="stamp red" id="sWin" style="display:none"></div>
  <div class="hand" id="sNote"></div>
  <div class="foot" id="sFoot">
    <div class="specs" id="sSpecs"></div>
    <div class="stats" id="sStats"></div>
    <div class="rule"></div>
    <div class="caprow"><div><div class="cap" id="sCap"></div><div class="rivaln" id="sRival"></div></div><div class="pg" id="sPg"></div></div>
    <div class="log" id="sLog"></div>
    <div class="actions"><div class="nav"><button id="prev" aria-label="Previous car">←</button><button id="next" aria-label="Next car">→</button><button id="specBtn" class="specbtn">Specs</button></div><button class="cta" id="race">Race this car</button></div>
  </div>
</section>

<section id="events" class="screen">
  <div class="top"><span class="m">AFTERHOURS</span><span class="r"><span>Pick tonight's event</span><button id="eBack">Back</button></span></div>
  <h1 class="hl" id="eHead"></h1>
  <div class="stamp" id="eStamp" style="top:29%;left:22px"></div>
  <div class="hand" id="eNote" style="left:50%;top:37%"></div>
  <div class="foot" id="eFoot">
    <div class="specs" id="eSpecs"></div>
    <div class="rule"></div>
    <div class="caprow"><div><div class="cap" id="eCap"></div><div class="rivaln" id="eGhost"></div></div><div class="pg" id="ePg"></div></div>
    <div class="actions"><div class="nav"><button id="ePrev" aria-label="Previous event">←</button><button id="eNext" aria-label="Next event">→</button></div><button class="cta" id="eGo">Race here</button></div>
  </div>
</section>

<section id="hud" class="screen">
  <div class="pos" id="hPos">4<small>/7</small></div>
  <ol class="board" id="hBoard"></ol>
  <div class="lap"><span id="hLap">Lap 1 of 2</span><b id="hTime">0:00.0</b><span class="gh" id="hGhost"></span></div>
  <button class="quit" id="quit">Quit race</button>
  <div class="toast" id="hToast"></div>
  <div class="msg" id="hMsg"></div>
  <div class="turn" id="hTurn"></div>
  <div class="spd"><b id="hSpd">0</b><span>MPH</span><div class="nb"><i id="hNos"></i></div><div class="fxl" id="hFx"></div></div>
  <div class="pads">
    <div class="grp"><button class="pad" data-k="left" aria-label="Steer left">◀</button><button class="pad" data-k="right" aria-label="Steer right">▶</button></div>
    <div class="grp"><button class="pad sm" data-k="brake">Brake</button><button class="pad sm nos" data-k="nitro">Boost</button></div>
  </div>
</section>

<section id="results" class="screen">
  <div class="top"><span class="m">AFTERHOURS</span><span class="r">Issue 01, event report</span></div>
  <div class="place" id="rPlace">P1</div>
  <div class="stamp red" id="rStamp" style="top:44%;left:22px"></div>
  <div class="foot">
    <div class="clip" id="rHead"></div>
    <dl class="tbl" id="rTbl"></dl>
    <ol class="order" id="rOrder"></ol>
    <div class="log" id="rLog"></div>
    <div class="actions"><button class="cta ghost" id="rBack">Back to the archive</button><button class="cta" id="rAgain">Run it back</button></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="js/afterhours.js?v=3"></script>
</body>
</html>
